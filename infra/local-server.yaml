# Ubuntu VM for the nginx/Gunicorn/systemd and Docker demonstrations.
# Start: limactl start --name=kittygram --yes infra/local-server.yaml
vmType: vz
cpus: 3
memory: 4GiB
disk: 20GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release-20260927/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:63a93bd5a8d76e33b15ceb5daa3657bd79be804748051ab178e643b0f5da22e7
mounts: []
containerd:
  system: false
  user: false
portForwards:
  - guestPort: 80
    hostPort: 8081
    static: true
  - guestPort: 8000
    hostPort: 8000
    static: true
