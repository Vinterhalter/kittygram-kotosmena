        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
      required:
      - id
      - name
    AchievementRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - name
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
    Cat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 32
        color:
          type: string
          maxLength: 32
        birth_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        image:
          type: string
          format: uri
          nullable: true
        achievements:
          type: array
          items:
            type: integer
      required:
      - birth_year
      - color
      - id
      - name
      - owner
    CatRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        color:
          type: string
          minLength: 1
          maxLength: 32
        birth_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        image:
          type: string
          format: binary
        achievements:
          type: array
          items:
            type: integer
      required:
      - birth_year
      - color
      - name
    Completion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        task:
          type: integer
        author:
          type: integer
          readOnly: true
        note:
          type: string
          maxLength: 2000
        evidence_url:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CompletionStatusEnum'
          readOnly: true
        review_note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - author
      - created_at
      - evidence_url
      - id
      - note
      - review_note
      - reviewed_at
      - status
      - task
    CompletionRequest:
      type: object
      properties:
        task:
          type: integer
        note:
          type: string
          minLength: 1
          maxLength: 2000
        evidence:
          type: string
          format: binary
          writeOnly: true
      required:
      - note
      - task
    CompletionStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - На проверке
        * `approved` - Принято
        * `rejected` - На доработке
    DecisionEnum:
      enum:
      - approved
      - rejected
      type: string
      description: |-
        * `approved` - approved
        * `rejected` - rejected
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
        kind:
          type: string
          maxLength: 40
        detail: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - id
      - kind
    ExtendRequest:
      type: object
      properties:
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - ends_at
      - reason
    Handover:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cat:
          type: integer
        owner:
          type: integer
          readOnly: true
        sitter:
          type: string
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        instructions:
          type: string
          maxLength: 3000
        status:
          allOf:
          - $ref: '#/components/schemas/HandoverStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cat
      - created_at
      - ends_at
      - id
      - owner
      - sitter
      - starts_at
      - status
    HandoverRequest:
      type: object
      properties:
        cat:
          type: integer
        sitter:
          type: string
          minLength: 1
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        instructions:
          type: string
          maxLength: 3000
      required:
      - cat
      - ends_at
      - sitter
      - starts_at
    HandoverStatusEnum:
      enum:
      - draft
      - active
      - closed
      - cancelled
      type: string
      description: |-
        * `draft` - Ожидает принятия
        * `active` - В работе
        * `closed` - Закрыта
        * `cancelled` - Отменена
    Incident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        handover:
          type: integer
        author:
          type: integer
          readOnly: true
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        description:
          type: string
          maxLength: 3000
        resolution:
          type: string
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - description
      - handover
      - id
      - resolution
      - resolved_at
      - severity
    IncidentRequest:
      type: object
      properties:
        handover:
          type: integer
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        description:
          type: string
          minLength: 1
          maxLength: 3000
      required:
      - description
      - handover
      - severity
    PaginatedAchievementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
