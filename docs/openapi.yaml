      type: string
      description: |-
        * `normal` - Обычный
        * `urgent` - Срочный
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        handover:
          type: integer
        title:
          type: string
          maxLength: 160
        instructions:
          type: string
          maxLength: 2000
        due_at:
          type: string
          format: date-time
        required:
          type: boolean
        photo_required:
          type: boolean
      required:
      - due_at
      - handover
      - id
      - title
    TaskRequest:
      type: object
      properties:
        handover:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 160
        instructions:
          type: string
          maxLength: 2000
        due_at:
          type: string
          format: date-time
        required:
          type: boolean
        photo_required:
          type: boolean
      required:
      - due_at
      - handover
      - title
    TokenCreate:
      type: object
      properties:
        password:
          type: string
        username:
          type: string
    TokenCreateRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
    User:
      type: object
      properties:
        email:
          title: Адрес электронной почты
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
      required:
      - id
      - username
    UserCreate:
      type: object
      properties:
        email:
          title: Адрес электронной почты
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        username:
          type: string
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        id:
          type: integer
          readOnly: true
      required:
      - id
      - username
    UserCreateRequest:
      type: object
      properties:
        email:
          title: Адрес электронной почты
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        username:
          type: string
          minLength: 1
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
