        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    PatchedCatRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        color:
          type: string
          minLength: 1
          maxLength: 32
        birth_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        image:
          type: string
          format: binary
        achievements:
          type: array
          items:
            type: integer
    PatchedTaskRequest:
      type: object
      properties:
        handover:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 160
        instructions:
          type: string
          maxLength: 2000
        due_at:
          type: string
          format: date-time
        required:
          type: boolean
        photo_required:
          type: boolean
    Report:
      type: object
      properties:
        handover:
          type: integer
        status:
          type: string
        tasks_total:
          type: integer
        required_total:
          type: integer
        approved_required:
          type: integer
        overdue:
          type: integer
        pending_reviews:
          type: integer
        unresolved_incidents:
          type: integer
        can_close:
          type: boolean
      required:
      - approved_required
      - can_close
      - handover
      - overdue
      - pending_reviews
      - required_total
      - status
      - tasks_total
      - unresolved_incidents
    ResolutionRequest:
      type: object
      properties:
        resolution:
          type: string
          minLength: 1
          maxLength: 3000
      required:
      - resolution
    ReviewRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        note:
          type: string
          default: ''
          maxLength: 2000
      required:
      - decision
    SeverityEnum:
      enum:
      - normal
