<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Котосмена — уход под контролем</title>
    <link rel="stylesheet" href="/static/web/style.css" />
  </head>
  <body>
    <header>
      <a href="#cats" class="brand"
        >Котосмена<span>Kittygram · забота по плану</span></a
      >
      <nav id="nav" hidden>
        <a href="#cats">Коты</a><a href="#handovers">Смены ухода</a
        ><button id="logout" class="quiet">Выйти</button>
      </nav>
    </header>
    <main id="app" aria-live="polite"></main>
    <dialog id="dialog">
      <form id="form">
        <div class="modal-head">
          <h2 id="form-title"></h2>
          <button type="button" id="cancel" aria-label="Закрыть">×</button>
        </div>
        <div id="fields"></div>
        <p id="form-error" class="error" role="alert"></p>
        <button type="submit">Сохранить</button>
      </form>
    </dialog>
    <footer>Котосмена · план, выполнение и проверка ухода</footer>
    <script src="/static/web/app.js" defer></script>
  </body>
</html>
